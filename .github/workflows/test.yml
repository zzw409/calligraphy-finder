name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Python syntax & import check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: py_compile check
        run: |
          python -m py_compile server.py finder.py stele.py build_doc.py
          echo "✅ All Python files compile cleanly"
      - name: Import smoke test
        run: |
          python -c "import server, finder, stele; print('✅ Modules import OK')"

  boot:
    name: Server boot & healthz
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Start server
        env:
          PORT: "5188"
        run: |
          nohup python server.py > server.log 2>&1 &
          sleep 5
          curl -fsS http://127.0.0.1:5188/healthz && echo
          curl -fsS http://127.0.0.1:5188/ | head -c 200 && echo
      - name: Show server log on failure
        if: failure()
        run: cat server.log
